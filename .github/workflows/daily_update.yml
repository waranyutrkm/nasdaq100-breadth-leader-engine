name: Daily Nasdaq-100 Market Update & GitHub Pages Deploy

on:
  schedule:
    # Run at 21:30 UTC (16:30 EST, Mon-Fri US Market Close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Fetch Latest Market Data from Yahoo Finance
        run: |
          python scripts/fetch_market_data.py

      - name: Generate Daily Signals & Breadth Regimes
        run: |
          python scripts/generate_signals.py

      - name: Run Backtest Audit & Update Equity Curves
        run: |
          python scripts/run_backtest_audit.py

      - name: Compile Standalone Dashboard
        run: |
          python scripts/build_dashboard.py

      - name: Commit and Push Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Daily Market Bot]"
          git add data/ index.html
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(data): automated daily Nasdaq-100 market update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi
